name: InstantCloser public policy lab

on:
  push:
    paths:
      - "projects/instantcloser/**"
      - ".github/workflows/instantcloser-lab.yml"
  pull_request:
    paths:
      - "projects/instantcloser/**"
      - ".github/workflows/instantcloser-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s projects/instantcloser/tests -v
      - name: Synthetic decision benchmark
        run: python -m projects.instantcloser.evaluate
