name: AI Engineer portfolio progress meter

on:
  pull_request:
    paths:
      - "data/ai-engineer-progress.json"
      - "data/ai-engineering-from-scratch-curriculum.json"
      - "scripts/ai-engineering-from-scratch-alignment.mjs"
      - "tests/ai-engineering-from-scratch-alignment.test.mjs"
      - "scripts/ai-engineer-progress.mjs"
      - "tests/ai-engineer-progress.test.mjs"
      - ".github/workflows/ai-engineer-progress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/ai-engineer-progress.test.mjs
      - name: Report visible progress
        run: |
          {
            echo "### Verified AI Engineer progress ledger"
            echo '~~~'
            node scripts/ai-engineer-progress.mjs
            echo '~~~'
            echo "A ledger entry is not independent evidence of successful external CI or customer delivery."
          } >> "$GITHUB_STEP_SUMMARY"
